name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    name: Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mcp-server/pnpm-lock.yaml

      - name: Install
        working-directory: mcp-server
        run: pnpm install --frozen-lockfile

      - name: Build (type-check)
        working-directory: mcp-server
        run: pnpm build

      - name: Test and coverage
        working-directory: mcp-server
        run: |
          set -o pipefail
          pnpm test:coverage 2>&1 | tee "$RUNNER_TEMP/vitest-coverage.txt"

      - name: Add coverage to job summary
        if: always()
        run: |
          {
            echo
            echo "## Coverage"
            echo
            echo '```text'
            if [[ -f "$RUNNER_TEMP/vitest-coverage.txt" ]]; then
              sed -n '/% Coverage report from v8/,$p' "$RUNNER_TEMP/vitest-coverage.txt"
            else
              echo "Coverage report was not generated."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: mcp-server/coverage
          if-no-files-found: ignore
          retention-days: 14
